version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: library_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]

  redis:
    image: redis:7.2
    container_name: library_redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "redis123"]
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
